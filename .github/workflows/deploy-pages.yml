name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Fix absolute paths for GitHub Pages
        run: |
          find ./frontend -type f -name "*.html" -o -name "*.js" -o -name "*.json" | xargs sed -i 's|"/assets|"./assets|g'
          find ./frontend -type f -name "*.html" -o -name "*.js" -o -name "*.json" | xargs sed -i 's|"/html|"./html|g'
          find ./frontend -type f -name "*.html" -o -name "*.js" -o -name "*.json" | xargs sed -i "s|'/html|'./html|g"
          find ./frontend -type f -name "*.html" -o -name "*.js" -o -name "*.json" | xargs sed -i 's|"/manifest.json|"./manifest.json|g'
          find ./frontend -type f -name "*.html" -o -name "*.js" -o -name "*.json" | xargs sed -i 's|"/service-worker.js|"./service-worker.js|g'
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
