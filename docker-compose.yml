version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: credtrust_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-credtrust}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CredTrust@123}
      POSTGRES_DB: ${DB_NAME:-credtrust_dev}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-credtrust} -d ${DB_NAME:-credtrust_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
